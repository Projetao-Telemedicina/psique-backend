services:
  postgres-test:
    image: postgres:16
    container_name: psique-postgres-test
    environment:
      POSTGRES_DB: ${CI_POSTGRES_DB:-psique_test}
      POSTGRES_USER: ${CI_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:-test}
    ports:
      - '${CI_POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${CI_POSTGRES_USER:-test} -d ${CI_POSTGRES_DB:-psique_test}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
