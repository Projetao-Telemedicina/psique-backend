services:
  postgres:
    image: postgres:16
    container_name: psique-postgres-dev
    environment:
      POSTGRES_DB: psique_dev
      POSTGRES_USER: psique
      POSTGRES_PASSWORD: psique
    ports:
      - '54320:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U psique -d psique_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
